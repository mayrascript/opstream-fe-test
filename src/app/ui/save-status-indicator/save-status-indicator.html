<span class="visually-hidden" aria-live="polite" aria-atomic="true">
  {{ announcement() }}
</span>

@if (state(); as save) {
  @if (save.status !== 'idle') {
    <div
      #statusContainer
      class="save-state"
      [class.save-state--error]="save.status === 'error'"
      [class.save-state--saved]="save.status === 'saved'"
      role="group"
      [attr.aria-label]="fieldLabel() + ' save status'"
      tabindex="-1"
    >
      <span class="save-state__dot" aria-hidden="true"></span>
      @switch (save.status) {
        @case ('saving') {
          <span>Saving…</span>
        }
        @case ('retrying') {
          <span>Error — retrying…</span>
        }
        @case ('saved') {
          <span>Saved</span>
        }
        @case ('error') {
          <span>Not saved</span>
        }
      }
      @if (save.status === 'error' || retryPending()) {
        <button
          #retryButton
          data-save-retry
          type="button"
          [attr.aria-disabled]="retryPending()"
          (click)="retry()"
        >
          {{ retryPending() ? 'Retrying…' : 'Retry' }}
          <span class="visually-hidden">saving {{ fieldLabel() }}</span>
        </button>
      }
    </div>
  }
}
