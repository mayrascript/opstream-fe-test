<section class="chooser-page" aria-labelledby="chooser-title">
  <div class="chooser-card">
    @if (loading()) {
      <div class="state-card" aria-live="polite">
        <span class="loader" aria-hidden="true"></span>
        Loading request types…
      </div>
    } @else if (error()) {
      <div class="state-card state-card--error" role="alert">
        <p>{{ error() }}</p>
        <button type="button" (click)="loadSchemas()">Try again</button>
      </div>
    } @else {
      <div class="chooser-content">
        <div class="chooser-question">
          <h1 id="chooser-title">What do you need to purchase?</h1>

          <div class="schema-chips" role="group" aria-label="Purchase category">
            @for (schema of schemas(); track schema.id; let index = $index) {
              <button
                #schemaChip
                class="schema-chip"
                type="button"
                [class.is-selected]="selectedSchemaId() === schema.id"
                [attr.aria-pressed]="selectedSchemaId() === schema.id"
                (click)="selectSchema(schema)"
              >
                @if (index === 0) {
                  <svg aria-hidden="true" viewBox="0 0 16 16">
                    <rect x="2" y="2" width="4" height="4" rx="0.75" />
                    <rect x="10" y="2" width="4" height="4" rx="0.75" />
                    <rect x="2" y="10" width="4" height="4" rx="0.75" />
                    <rect x="10" y="10" width="4" height="4" rx="0.75" />
                  </svg>
                } @else {
                  <svg aria-hidden="true" viewBox="0 0 16 16">
                    <path d="M8 1.75 13.5 5v6L8 14.25 2.5 11V5L8 1.75Z" />
                    <path d="m2.75 5.15 5.25 3 5.25-3M8 8.15v5.75" />
                  </svg>
                }
                <span>{{ schemaLabel(schema) }}</span>
              </button>
            }
          </div>

          <p class="selection-error" aria-live="assertive">{{ selectionError() }}</p>
        </div>

        <button class="start-button" type="button" (click)="start()">Start</button>
      </div>
    }
  </div>
</section>
