<form [formGroup]="group()" (ngSubmit)="handleSubmit()" novalidate>
  <div class="section-heading">
    <h1>{{ section().title }}</h1>
  </div>

  <div class="fields">
    @for (field of section().fields; track field.id) {
      <app-dynamic-field
        [field]="field"
        [control]="group().controls[field.id.toString()]"
        [attempted]="attempted()"
        [saveState]="saveStates().get(field.id)"
        (retryRequested)="retryRequested.emit($event)"
      />
    }
  </div>

  <div class="form-actions">
    @if (!isFirst()) {
      <app-button size="compact" variant="secondary" (click)="previousRequested.emit()">
        Previous
      </app-button>
    }
    <app-button size="compact" type="submit" [disabled]="submitting()">
      {{ isLast() ? (submitting() ? 'Submitting…' : 'Submit') : 'Next' }}
    </app-button>
  </div>
</form>
