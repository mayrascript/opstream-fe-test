<fieldset
  class="field-shell"
  [class.field-shell--invalid]="showError()"
  [attr.aria-describedby]="showError() ? errorId() : null"
>
  <legend class="visually-hidden">
    {{ field().label }}{{ field().required ? ' (required)' : '' }}
  </legend>

  <div class="field-shell__heading">
    @if (labelFor(); as controlId) {
      <label class="field-shell__label" [id]="labelId()" [for]="controlId">
        {{ field().label }}
        @if (field().required) {
          <span class="required" aria-hidden="true">*</span>
          <span class="visually-hidden">(required)</span>
        }
      </label>
    } @else {
      <span class="field-shell__label" [id]="labelId()">
        {{ field().label }}
        @if (field().required) {
          <span class="required" aria-hidden="true">*</span>
          <span class="visually-hidden">(required)</span>
        }
      </span>
    }
    <app-save-status-indicator
      [state]="saveState()"
      [fieldLabel]="field().label"
      (retryRequested)="retryRequested.emit()"
    />
  </div>

  <div class="field-shell__control">
    <ng-content />
  </div>

  @if (showError()) {
    <app-form-error [errorId]="errorId()" [message]="errorMessage()" />
  }
</fieldset>
