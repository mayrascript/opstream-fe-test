<fieldset class="field-shell" [class.field-shell--invalid]="showError()">
  <div class="field-shell__heading">
    <legend [id]="labelId()">
      {{ field().label }}
      @if (field().required) {
        <span class="required" aria-hidden="true">*</span>
        <span class="visually-hidden">(required)</span>
      }
    </legend>
    <app-save-status-indicator [state]="saveState()" (retryRequested)="retryRequested.emit()" />
  </div>

  <ng-content />

  @if (showError()) {
    <app-form-error [errorId]="errorId()" />
  }
</fieldset>
